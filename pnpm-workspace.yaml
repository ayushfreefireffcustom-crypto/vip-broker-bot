# Single-package repo. `packages` keeps pnpm 9 (some CI/build images) from erroring
# "packages field missing or empty"; `allowBuilds` is the pnpm 10+ build-script
# allowlist (Prisma/esbuild need their postinstall).
packages:
  - '.'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
